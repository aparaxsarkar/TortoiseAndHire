services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tortoiseandhire
      POSTGRES_PASSWORD: tortoiseandhire
      POSTGRES_DB: tortoiseandhire
    ports:
      - "5432:5432"
    volumes:
      - tortoiseandhire-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tortoiseandhire -d tortoiseandhire"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tortoiseandhire:tortoiseandhire@postgres:5432/tortoiseandhire
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  tortoiseandhire-postgres-data:
