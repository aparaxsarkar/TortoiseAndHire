name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # The test job's Postgres service. Integration tests skip themselves when
  # DATABASE_URL is not a reachable postgres:// URL (e.g. local runs).
  DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/tortoiseandhire_test

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: mypy
      - run: lint-imports
      # Visible, not blocking: the CVE database changes independently of our
      # code, so a hard-fail here means CI can go red on a day with zero
      # commits (found true on Day 1 - a fresh install already carried
      # unrelated transitive-dependency advisories). --strict only affects
      # dependency-*collection* failures, not findings, so it stays on for
      # honest reporting; continue-on-error is what keeps this advisory.
      - run: pip install pip-audit && pip-audit --strict --skip-editable
        continue-on-error: true

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tortoiseandhire_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Apply migrations
        run: alembic upgrade head
      - name: Migration round-trips (down to base and back)
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Models match the migration (autogenerate is empty)
        run: alembic check
      - run: pytest

# build / migrations-check jobs are added as the code they exercise lands -
# see docs/architecture.md §10 and the build plan in ADR-0001.
