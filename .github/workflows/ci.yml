name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: mypy
      - run: lint-imports
      # Visible, not blocking: the CVE database changes independently of our
      # code, so a hard-fail here means CI can go red on a day with zero
      # commits (found true on Day 1 - a fresh install already carried
      # unrelated transitive-dependency advisories). --strict only affects
      # dependency-*collection* failures, not findings, so it stays on for
      # honest reporting; continue-on-error is what keeps this advisory.
      - run: pip install pip-audit && pip-audit --strict --skip-editable
        continue-on-error: true

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest

# build / migrations-check jobs (and a Postgres service for the test job) are
# added as the code they exercise lands - see docs/architecture.md §10 and the
# build plan in ADR-0001.
