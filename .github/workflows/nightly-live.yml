name: nightly-live

# The `@live` adapter smoke tests hit real Greenhouse + Lever. Excluded from CI
# (`-m 'not live'`); run here on a schedule so a board changing its response
# shape is caught within a day. A red run is the signal - it blocks nothing.

on:
  schedule:
    - cron: "0 8 * * *" # 08:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Live adapter smoke tests
        run: pytest -m live -v
